name: Build Android APK

on:
  push:
    branches: [stable]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools/latest
          cd $HOME/android-sdk/cmdline-tools/latest
          curl -sL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip
          if [ -d cmdline-tools ]; then mv cmdline-tools/* . && rmdir cmdline-tools; fi
          rm -f cmdline-tools.zip
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Build web app (Vite)
        run: npm run build
        working-directory: frontend

      - name: Sync Capacitor Android
        run: |
          if [ ! -d android ]; then ./node_modules/.bin/cap add android; fi
          ./node_modules/.bin/cap sync android
        working-directory: frontend

      - name: Build Debug APK
        run: ./gradlew assembleDebug
        working-directory: frontend/android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KasirKu-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
